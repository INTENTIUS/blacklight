name = "blacklight"
main = "src/handler.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# Served at blacklight.intentius.workers.dev (worker name + the account's
# workers.dev subdomain). A custom domain (blacklight.intentius.io) needs the
# intentius.io zone on Cloudflare — deferred; see issue #1.

# The SPA is served from this same Worker via Static Assets, declared here so
# EVERY deploy path carries it — Workers Builds' plain `npx wrangler deploy`
# included. The [build] command produces web/dist before wrangler bundles, so a
# fresh clone (Workers Builds' container, the clean-room e2e image) needs no
# extra flags or dashboard config. Requests that match an asset are served from
# web/dist; everything else (/audit, /stats) falls through to the worker. (#19)
[build]
command = "npm --prefix web install --no-fund --no-audit && npm --prefix web run build"

[assets]
directory = "./web/dist"

# Server-side git token (lifts rate limits, resolves action SHAs/image digests).
# Set with: wrangler secret put GIT_TOKEN
# [vars] GIT_TOKEN is a secret, not a plain var.

# chant 0.44: azure's post-synth barrel pulls deploy-scopes.ts, which computes
# dirname(fileURLToPath(import.meta.url)) at module scope. import.meta.url is
# undefined on workerd, so the worker crashes at startup. Pinning it to a fixed
# file: URL makes the init succeed; the lexicon-JSON lookup it feeds then misses
# and AZR030 falls back to resource-group-only scopes (its documented fallback).
[define]
"import.meta.url" = "\"file:///worker/handler.js\""

# Anonymous audit counter + per-IP/global rate limiting (#357). Bound by config
# so Workers Builds picks it up on deploy — no dashboard step.
[[kv_namespaces]]
binding = "STATS"
id = "a9d537a35aab42b19acd1f22787535a0"

# Exact in-flight concurrency cap (#4): one Durable Object instance sheds with
# 429 when MAX_IN_FLIGHT audits are already running. Advisory — the handler
# proceeds uncapped if the DO is unavailable. SQLite-backed class (the only
# kind new migrations may create on the free plan); it uses no storage.
[[durable_objects.bindings]]
name = "GATE"
class_name = "ConcurrencyGate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ConcurrencyGate"]
